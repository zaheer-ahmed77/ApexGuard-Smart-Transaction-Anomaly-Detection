version: '3.8'

services:
  sentry-aml-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentry-aml-platform
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: always
