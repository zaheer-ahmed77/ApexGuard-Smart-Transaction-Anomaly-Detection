  <circle cx="58" cy="44" r="2" fill="#09090b"/>
  <path d="M 39 41 Q 42 39 45 41" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 55 41 Q 58 39 61 41" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Confident Smile -->
