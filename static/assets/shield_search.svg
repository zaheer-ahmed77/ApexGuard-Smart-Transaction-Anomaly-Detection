<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="80" cy="142" rx="48" ry="8" fill="#e2e8f0"/>

  <!-- Protective Shield -->
  <path d="M 80 20 C 110 20, 132 32, 132 58 C 132 94, 110 120, 80 134 C 50 120, 28 94, 28 58 C 28 32, 50 20, 80 20 Z" 
        fill="#ffffff" 
        stroke="#09090b" 
        stroke-width="3" 
        filter="url(#softGlow)"/>

  <!-- Inner Security Grid Lines -->
  <path d="M 46 58 Q 80 72 114 58" fill="none" stroke="#f4f4f5" stroke-width="2"/>
  <path d="M 42 82 Q 80 96 118 82" fill="none" stroke="#f4f4f5" stroke-width="2"/>
  <line x1="80" y1="28" x2="80" y2="126" stroke="#f4f4f5" stroke-width="2"/>

  <!-- Modern Magnifying Glass -->
  <g transform="translate(18, 14)">
    <circle cx="68" cy="68" r="26" fill="#ffffff" stroke="#09090b" stroke-width="4"/>
    <circle cx="68" cy="68" r="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Target Crosshair / Radar Scan in Lens -->
    <line x1="68" y1="52" x2="68" y2="84" stroke="#09090b" stroke-width="2" stroke-linecap="round"/>
    <line x1="52" y1="68" x2="84" y2="68" stroke="#09090b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="68" cy="68" r="4" fill="#09090b"/>

    <!-- Lens Glare -->
    <path d="M 54 58 A 18 18 0 0 1 78 52" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Handle -->
    <line x1="87" y1="87" x2="114" y2="114" stroke="#09090b" stroke-width="7" stroke-linecap="round"/>
    <line x1="91" y1="91" x2="110" y2="110" stroke="#71717a" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Verified Check / Star Sparkle -->
  <polygon points="40,36 43,44 51,47 43,50 40,58 37,50 29,47 37,44" fill="#09090b"/>
  <circle cx="122" cy="42" r="3" fill="#09090b"/>
</svg>
