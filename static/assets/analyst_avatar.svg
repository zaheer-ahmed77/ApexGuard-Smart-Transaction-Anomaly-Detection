<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background Circle (Soft Gray Tint) -->
  <circle cx="50" cy="50" r="48" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="2"/>
  
  <!-- Torso & Blazer -->
  <path d="M 22 96 C 22 75, 36 68, 50 68 C 64 68, 78 75, 78 96 Z" fill="#18181b"/>
  <!-- Shirt Collar -->
  <polygon points="50,70 42,84 58,84" fill="#ffffff"/>
  <polygon points="50,74 46,94 54,94" fill="#09090b"/>

  <!-- Neck -->
  <rect x="44" y="58" width="12" height="14" rx="4" fill="#fbd38d"/>
  
  <!-- Face -->
  <ellipse cx="50" cy="46" rx="20" ry="22" fill="#fbd38d"/>
  
  <!-- Hair (Modern sleek dark undercut) -->
  <path d="M 30 42 C 30 25, 40 20, 52 20 C 66 20, 72 26, 72 40 C 72 42, 68 32, 60 30 C 50 28, 38 34, 30 42 Z" fill="#27272a"/>

  <!-- Stylish Glasses (Black wireframe) -->
  <rect x="36" y="42" width="11" height="8" rx="2" fill="none" stroke="#09090b" stroke-width="2"/>
  <rect x="53" y="42" width="11" height="8" rx="2" fill="none" stroke="#09090b" stroke-width="2"/>
  <line x1="47" y1="46" x2="53" y2="46" stroke="#09090b" stroke-width="2"/>

  <!-- Eyes & Pupils -->
  <circle cx="41.5" cy="46" r="1.8" fill="#18181b"/>
  <circle cx="58.5" cy="46" r="1.8" fill="#18181b"/>
  
  <!-- Eyebrows -->
  <path d="M 36 39 Q 41 37 46 39" fill="none" stroke="#27272a" stroke-width="2" stroke-linecap="round"/>
  <path d="M 54 39 Q 59 37 64 39" fill="none" stroke="#27272a" stroke-width="2" stroke-linecap="round"/>

  <!-- Friendly Smile -->
  <path d="M 44 58 Q 50 63 56 58" fill="none" stroke="#713f12" stroke-width="2" stroke-linecap="round"/>
</svg>
